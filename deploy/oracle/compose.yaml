services:
  worker:
    build:
      context: ../..
      dockerfile: services/worker/Dockerfile
    image: forged-worker:local
    restart: unless-stopped
    init: true
    env_file:
      - /etc/forged/worker.env
    environment:
      WORKER_BIND_HOST: 0.0.0.0
      PORT: '8080'
      SUPABASE_CA_CERT_PATH: /run/forged/supabase-root.crt
    volumes:
      - /etc/forged/supabase-root.crt:/run/forged/supabase-root.crt:ro
    ports:
      - '127.0.0.1:8080:8080'
    stop_grace_period: 90s
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
